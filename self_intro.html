<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タキケンの自己紹介</title>
  <style>
    :root {
      --accent: #2563eb;   /* アクセントカラー（青） */
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --sub: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      max-width: 480px;
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 40px 32px;
      text-align: center;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #60a5fa);
      color: #fff;
      font-size: 48px;
      line-height: 120px;
      margin: 0 auto 20px;
      overflow: hidden;
      border: 4px solid #fff;
      box-shadow: 0 4px 14px rgba(37,99,235,0.25);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 { font-size: 28px; margin-bottom: 6px; }
    .tagline { color: var(--sub); font-size: 15px; margin-bottom: 28px; }
    h2 {
      font-size: 16px;
      color: var(--accent);
      text-align: left;
      margin: 24px 0 12px;
      border-left: 4px solid var(--accent);
      padding-left: 10px;
    }
    .likes { list-style: none; text-align: left; }
    .likes li {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
      font-size: 15px;
    }
    .likes li span { margin-right: 8px; }
    footer { margin-top: 28px; font-size: 12px; color: var(--sub); }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">
      <img src="profile.jpg" alt="タキケンの写真"
           onerror="this.style.display='none'; this.parentNode.textContent='タ';">
    </div>
    <h1>タキケン</h1>
    <p class="tagline">AI勉強中の会社員です</p>

    <h2>好きなこと・興味</h2>
    <ul class="likes">
      <li><span>🎵</span>Suno AI で音楽づくり</li>
      <li><span>🗺️</span>Google マップで口コミを書く・読む</li>
    </ul>

    <footer>Claude Code で作った自己紹介ページ 🚀</footer>
  </main>
</body>
</html>
