<title>ねいろたたき</title>
<style>
  /* ===== 全体 ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;               /* テレビでスクロールさせない */
    background: #0d1b2a;
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Hiragino Sans",
                 "Yu Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    position: relative;
    height: 100%;
    padding: 3vh 4vw;               /* Fire TVの画面端が切れる対策（オーバースキャン） */
    display: flex; flex-direction: column; align-items: center; gap: 1vh;
    background:
      radial-gradient(120% 80% at 50% 0%, #bfefff 0%, #8ed8ff 45%, #6cc6f5 60%),
      #6cc6f5;
  }
  /* 地面（4つの穴すべてが地面の上にくるように高くとる） */
  #app::after {
    content: ""; position: absolute; left: -5%; right: -5%; bottom: 0; height: 80%;
    background: linear-gradient(#8fd479 0%, #6cb95c 35%, #4f9c44 100%);
    border-radius: 50% 50% 0 0 / 8% 8% 0 0;
    z-index: 0;
  }

  /* ===== 上部の得点表示 ===== */
  #hud {
    position: relative; z-index: 2;
    width: 100%; max-width: 1100px;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 2vw;
  }
  .stat { text-align: center; line-height: 1.05; }
  .stat__label {
    display: block;
    font-size: clamp(16px, 2.2vh, 26px);
    font-weight: 700; color: #12405e;
    letter-spacing: .05em;
  }
  .stat__value {
    display: block;
    font-size: clamp(34px, 8vh, 84px);
    font-weight: 900; color: #fff;
    text-shadow: 0 .4vh 0 #12405e, 0 0 1.2vh rgba(0,0,0,.25);
    font-variant-numeric: tabular-nums;
  }
  .stat--time .stat__value { color: #fff59d; }
  .stat--time.is-hurry .stat__value { color: #ff7043; animation: blink .5s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* ===== 盤面（十字に4つの穴） ===== */
  #board {
    position: relative; z-index: 1;
    margin: auto 0;                 /* 残りの高さの中央にそろえる */
    width: min(92vw, 70vh); height: min(92vw, 70vh);
    display: grid;
    /* minmax(0,1fr) にしないと、中の文字の都合で行の高さが崩れる（スマホで実際に崩れた） */
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
  }
  .hole { position: relative; }
  .hole--up    { grid-area: 1 / 2; }
  .hole--left  { grid-area: 2 / 1; }
  .hole--right { grid-area: 2 / 3; }
  .hole--down  { grid-area: 3 / 2; }

  /* 穴のくぼみ（奥） */
  .hole__dark {
    position: absolute; left: 8%; right: 8%; bottom: 17%; height: 15%;
    background: radial-gradient(closest-side, #1b0f06 60%, #35200f 100%);
    border-radius: 50%;
    z-index: 0;
  }
  /* ねいろが出入りする部分（ここから下は見えない） */
  .hole__stage {
    position: absolute; left: 0; right: 0; top: 0; bottom: 20%;
    overflow: hidden;
    z-index: 1;
  }
  .neiro {
    position: absolute; left: 13%; bottom: 0; width: 74%; aspect-ratio: 1 / 1;
    border-radius: 50%; overflow: hidden;
    border: 0.6vmin solid #fff;
    box-shadow: 0 0.6vmin 1.2vmin rgba(0,0,0,.35);
    transform: translateY(118%);
    transition: transform .16s ease-out;
    background: #d9c3a5;
  }
  .neiro img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hole.is-up .neiro { transform: translateY(14%); }
  .hole.is-hit .neiro { transform: translateY(38%) scale(.82); }
  /* きらきらねいろ */
  .neiro.is-gold { border-color: #ffd54a; box-shadow: 0 0 2vmin .8vmin #ffd54a; }
  .neiro.is-gold img { filter: saturate(1.5) brightness(1.12) sepia(.22); }

  /* 穴の手前のふち */
  .hole__lip {
    position: absolute; left: 6%; right: 6%; bottom: 14%; height: 14%;
    background: linear-gradient(#8a5a30 0%, #6b4426 45%, #40260f 100%);
    border-radius: 50%;
    box-shadow: inset 0 .5vmin .8vmin rgba(0,0,0,.55), 0 .4vmin .6vmin rgba(0,0,0,.25);
    z-index: 2;
  }
  /* ボタンの向き表示 */
  .hole__key {
    position: absolute; left: 0; right: 0; bottom: 0;
    text-align: center;
    font-size: clamp(24px, 4.6vh, 56px);
    font-weight: 900; color: #fff;
    text-shadow: 0 .3vh 0 #2c6b23;
    z-index: 3;
  }
  .hole.is-wrong .hole__key { color: #ff8a65; animation: shake .25s; }
  @keyframes shake {
    25% { transform: translateX(-8%); } 75% { transform: translateX(8%); }
  }
  /* 得点のふきだし */
  .hole__pop {
    position: absolute; left: 0; right: 0; top: 6%;
    text-align: center;
    font-size: clamp(26px, 5vh, 60px); font-weight: 900;
    color: #fff; text-shadow: 0 .3vh 0 #e65100;
    opacity: 0; z-index: 4; pointer-events: none;
  }
  .hole__pop.is-show { animation: pop .7s ease-out; }
  @keyframes pop {
    0%   { opacity: 1; transform: translateY(0) scale(.6); }
    30%  { opacity: 1; transform: translateY(-18%) scale(1.2); }
    100% { opacity: 0; transform: translateY(-55%) scale(1); }
  }

  /* ===== 中央の十字キーガイド ===== */
  #center {
    grid-area: 2 / 2;
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .dpad {
    position: relative; width: 68%; aspect-ratio: 1 / 1;
    border-radius: 26%;
    background: rgba(255,255,255,.35);
    box-shadow: inset 0 0 0 .5vmin rgba(255,255,255,.6);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    place-items: center;
    color: #12405e;
    font-size: clamp(14px, 2.6vh, 30px); font-weight: 900;
  }
  .dpad__arrow { transition: transform .1s, color .1s; }
  .dpad__arrow--up    { grid-area: 1 / 2; }
  .dpad__arrow--left  { grid-area: 2 / 1; }
  .dpad__arrow--right { grid-area: 2 / 3; }
  .dpad__arrow--down  { grid-area: 3 / 2; }
  .dpad__arrow.is-cue { color: #e64a19; transform: scale(1.7); }
  /* 中央は決定ボタンに見立てた丸（文字にすると狭い画面で折り返して崩れるため） */
  .dpad__center {
    grid-area: 2 / 2; width: 52%; aspect-ratio: 1 / 1;
    border-radius: 50%; background: rgba(255,255,255,.75);
    box-shadow: inset 0 0 0 .3vmin rgba(18,64,94,.25);
  }
  /* 「〜れんぞく！」は穴とかぶらないよう、空の帯に置く（高さは固定して盤面をずらさない） */
  #combo {
    position: relative; z-index: 2;
    width: 100%; height: 1.4em; line-height: 1.4em; text-align: center;
    font-size: clamp(18px, 3.2vh, 36px); font-weight: 900; color: #e64a19;
    text-shadow: 0 0 .6vh #fff, 0 0 .6vh #fff, 0 .2vh 0 #fff;
  }

  /* ===== 説明・結果の画面 ===== */
  #overlay {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(4, 26, 43, .82);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.2vh; text-align: center; padding: 4vh 6vw;
    color: #fff;
  }
  #overlay.is-hidden { display: none; }
  #ovTitle {
    font-size: clamp(30px, 8vh, 88px); font-weight: 900; line-height: 1.15;
    color: #ffe082; text-shadow: 0 .5vh 0 #6d4c00;
  }
  #ovBody {
    font-size: clamp(18px, 3.2vh, 34px); font-weight: 700; line-height: 1.7;
  }
  #ovBody .big {
    display: block;
    font-size: clamp(44px, 11vh, 120px); font-weight: 900; color: #fff;
    line-height: 1.1; margin: .5vh 0;
  }
  #ovHint {
    font-size: clamp(18px, 3vh, 32px); font-weight: 900;
    background: #ff7043; color: #fff;
    padding: .7em 1.4em; border-radius: 999px;
    box-shadow: 0 .6vh 0 #bf360c;
    animation: breathe 1.4s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: translateY(-.6vh); } }
  #countdown {
    position: absolute; inset: 0; z-index: 9;
    display: none; align-items: center; justify-content: center;
    font-size: clamp(90px, 34vh, 340px); font-weight: 900;
    color: #fff; text-shadow: 0 1vh 0 #12405e;
    pointer-events: none;
  }
  #countdown.is-show { display: flex; animation: cdPop .6s ease-out; }
  @keyframes cdPop { from { transform: scale(.4); opacity: 0; } }

  /* ===== スマホ（老眼対応で文字をひとまわり大きく） ===== */
  @media (max-width: 600px) {
    .stat__label { font-size: 19px; }
    .stat__value { font-size: clamp(38px, 9vh, 72px); }
    #board { width: 94vw; height: 94vw; max-height: 62vh; }
    .hole__key { font-size: 34px; }
    #ovBody  { font-size: 22px; }
    #ovHint  { font-size: 21px; }
    #combo   { font-size: 20px; }
  }
</style>
<div id="app">
  <header id="hud">
    <div class="stat"><span class="stat__label">とくてん</span><span class="stat__value" id="score">0</span></div>
    <div class="stat stat--time" id="timeBox"><span class="stat__label">のこり</span><span class="stat__value" id="time">30</span></div>
    <div class="stat"><span class="stat__label">さいこう</span><span class="stat__value" id="best">0</span></div>
  </header>

  <div id="combo"></div>

  <div id="board">
    <div id="center">
      <div class="dpad" id="dpad"><span class="dpad__center"></span></div>
    </div>
  </div>

  <div id="countdown"></div>

  <div id="overlay">
    <div id="ovTitle">ねいろたたき</div>
    <div id="ovBody"></div>
    <div id="ovHint">けっていボタン で スタート</div>
  </div>
</div>

// ---- 音（音声ファイルは使わず、ブラウザで合成する）----
let ac = null;
function audio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!ac) ac = new AC();
  if (ac.state === 'suspended') ac.resume();   // 最初のボタン操作で鳴るようになる
  return ac;
}
function tone(freq, delay, dur, type = 'square', vol = 0.18) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + delay;
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
const melody = (notes, step, type, vol) =>
  notes.forEach((f, i) => tone(f, i * step, step * 1.6, type, vol));
const sndHit   = () => { tone(880, 0, .09); tone(1320, .06, .13); };
const sndGold  = () => melody([784, 988, 1175, 1568], .06, 'triangle', .17);
const sndWrong = () => tone(150, 0, .14, 'sawtooth', .10);
const sndCount = () => tone(660, 0, .12, 'triangle', .18);
const sndStart = () => melody([523, 659, 784, 1047], .09, 'square', .18);
const sndEnd   = () => melody([784, 659, 523, 392], .18, 'triangle', .18);

// ---- ゲームの状態 ----
let state = 'ready';        // ready / count / play / over
let score = 0, combo = 0, maxCombo = 0;
let best = Number(localStorage.getItem(BEST_KEY)) || 0;
let endAt = 0, current = null, spawnTimer = null, tickTimer = null;

$('best').textContent = best;

// 残り時間で難しくする（0→1で進行）
const progress = () => Math.min(1, Math.max(0, 1 - (endAt - Date.now()) / DURATION));
const upTime   = () => 1150 - 500 * progress();   // 顔を出している時間
const gapTime  = () => 800  - 400 * progress();   // 次に出るまでの間

function showOverlay(title, bodyHtml, hint) {
  $('ovTitle').innerHTML = title;
  $('ovBody').innerHTML = bodyHtml;
  $('ovHint').textContent = hint;
  overlay.classList.remove('is-hidden');
}

function titleScreen() {
  state = 'ready';
  showOverlay('ねいろたたき',
    'あなから でてきた <b>ねいろ</b> を<br>' +
    'リモコンの <b>↑ ← → ↓</b> でタッチ！<br>' +
    '<span style="color:#ffd54a">きらきらねいろ</span> は 3てん<br>' +
    'せいげんじかん 30びょう',
    'けっていボタン で スタート');
}

function startGame() {
  score = 0; combo = 0; maxCombo = 0;
  $('score').textContent = 0;
  $('time').textContent = 30;
  $('combo').textContent = '';
  $('timeBox').classList.remove('is-hurry');
  overlay.classList.add('is-hidden');
  hideAll();
  state = 'count';
  countdown(3);
}

function countdown(n) {
  const cd = $('countdown');
  if (n === 0) {
    cd.classList.remove('is-show');
    cd.textContent = '';
    sndStart();
    play();
    return;
  }
  cd.textContent = (n === 1) ? 'よーい' : n;
  cd.classList.remove('is-show');
  void cd.offsetWidth;          // アニメをやり直させるための小技
  cd.classList.add('is-show');
  sndCount();
  setTimeout(() => countdown(n - 1), 700);
}

function play() {
  state = 'play';
  endAt = Date.now() + DURATION;
  tickTimer = setInterval(tick, 100);
  scheduleSpawn(300);
}

function tick() {
  const left = Math.max(0, endAt - Date.now());
  $('time').textContent = Math.ceil(left / 1000);
  $('timeBox').classList.toggle('is-hurry', left <= 5000);
  if (left <= 0) endGame();
}

function scheduleSpawn(ms) {
  clearTimeout(spawnTimer);
  spawnTimer = setTimeout(spawn, ms);
}

function spawn() {
  if (state !== 'play') return;
  // 直前と同じ穴が続きすぎないように、1回だけ引き直す
  let d = DIRS[Math.floor(Math.random() * DIRS.length)];
  if (current && current.dir === d.n) d = DIRS[Math.floor(Math.random() * DIRS.length)];
  const gold = Math.random() < GOLD_RATE;
  const h = holes[d.n];

  h.neiro.classList.toggle('is-gold', gold);
  h.el.classList.remove('is-hit');
  h.el.classList.add('is-up');
  h.arrow.classList.add('is-cue');      // 中央のガイドも光らせて、向きを覚えやすくする

  current = { dir: d.n, gold, timer: setTimeout(escaped, upTime()) };
}

function hide(dirName) {
  const h = holes[dirName];
  // is-hit / is-wrong を消し忘れると、たたいたねいろが顔を出したまま残る
  h.el.classList.remove('is-up', 'is-hit', 'is-wrong');
  h.arrow.classList.remove('is-cue');
}
function hideAll() { DIRS.forEach(d => hide(d.n)); }

function escaped() {          // たたけなかった（にげられた）
  if (!current) return;
  hide(current.dir);
  current = null;
  combo = 0;
  $('combo').textContent = '';
  scheduleSpawn(gapTime());
}

function press(dirName) {
  if (state === 'ready' || state === 'over') { startGame(); return; }
  if (state !== 'play') return;

  if (current && current.dir === dirName) {
    const { gold } = current;
    clearTimeout(current.timer);
    const h = holes[dirName];
    hide(dirName);
    h.el.classList.add('is-hit');                                  // たたかれてへこむ演出
    setTimeout(() => h.el.classList.remove('is-hit'), 200);        // そのあと穴に沈む
    current = null;

    score += gold ? GOLD_SCORE : 1;
    combo += 1;
    maxCombo = Math.max(maxCombo, combo);
    $('score').textContent = score;
    $('combo').textContent = combo >= 2 ? combo + 'れんぞく！' : '';
    popText(h.pop, gold ? '+3' : '+1');
    gold ? sndGold() : sndHit();

    scheduleSpawn(Math.max(260, gapTime() * 0.6));
  } else {
    const h = holes[dirName];      // おてつき（点は減らさない）
    h.el.classList.remove('is-wrong');
    void h.el.offsetWidth;
    h.el.classList.add('is-wrong');
    combo = 0;
    $('combo').textContent = '';
    sndWrong();
  }
}

function popText(el, text) {
  el.textContent = text;
  el.classList.remove('is-show');
  void el.offsetWidth;
  el.classList.add('is-show');
}

function praise(s) {
  if (s >= 25) return 'てんさい！！';
  if (s >= 18) return 'すごい！';
  if (s >= 12) return 'じょうず！';
  if (s >= 6)  return 'いいね！';
  return 'よく がんばったね！';
}

function endGame() {
  state = 'over';
  clearInterval(tickTimer);
  clearTimeout(spawnTimer);
  if (current) { clearTimeout(current.timer); hide(current.dir); current = null; }
  hideAll();
  $('time').textContent = 0;
  $('combo').textContent = '';
  $('timeBox').classList.remove('is-hurry');

  const isNew = score > best;
  if (isNew) { best = score; localStorage.setItem(BEST_KEY, String(best)); $('best').textContent = best; }
  sndEnd();

  showOverlay(praise(score),
    'ねいろを ' + '<span class="big">' + score + '</span>' + 'てん ぶん タッチ！<br>' +
    'さいこう れんぞく ' + maxCombo + 'かい<br>' +
    (isNew ? '<b style="color:#ffd54a">あたらしい きろく！</b>' : 'さいこうきろく ' + best + 'てん'),
    'けっていボタン で もういっかい');
}

// ---- リモコン・キーボードの入力 ----
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;                       // 長押しの連射は無視
  const d = DIRS.find(x => x.key === e.key);
  if (d) { e.preventDefault(); press(d.n); return; }
  if (e.key === 'Enter' || e.key === ' ') {   // Fire TVの決定ボタン
    e.preventDefault();
    if (state === 'ready' || state === 'over') startGame();
  }
});
// タイトル・結果画面はどこをタップしても始まる（スマホ確認用）
overlay.addEventListener('click', () => { if (state === 'ready' || state === 'over') startGame(); });

titleScreen();
</script>
