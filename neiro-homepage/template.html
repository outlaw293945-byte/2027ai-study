<meta charset="utf-8" />
<title>ねいろの音色</title>
<style>
  :root {
    --bg: #ddd0af;
    --bg-2: #cabb92;
    --card: #faf2e0;
    --card-edge: #efe3c8;
    --ink: #3e2b1f;
    --ink-soft: #6b584a;
    --accent: #bd5f34;
    --accent-ink: #fff6ec;
    --tape-a: #7fa189;
    --tape-b: #dd97a2;
    --shadow: rgba(62, 43, 31, 0.28);
    --ring: #e2d3ab;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #241a12;
      --bg-2: #2e2013;
      --card: #3a2b1e;
      --card-edge: #4a3826;
      --ink: #f1e4cf;
      --ink-soft: #c9b79c;
      --accent: #e39463;
      --accent-ink: #2a1a10;
      --tape-a: #6f9280;
      --tape-b: #c98793;
      --shadow: rgba(0, 0, 0, 0.55);
      --ring: #4a3826;
    }
  }
  :root[data-theme="dark"] {
    --bg: #241a12;
    --bg-2: #2e2013;
    --card: #3a2b1e;
    --card-edge: #4a3826;
    --ink: #f1e4cf;
    --ink-soft: #c9b79c;
    --accent: #e39463;
    --accent-ink: #2a1a10;
    --tape-a: #6f9280;
    --tape-b: #c98793;
    --shadow: rgba(0, 0, 0, 0.55);
    --ring: #4a3826;
  }
  :root[data-theme="light"] {
    --bg: #ddd0af;
    --bg-2: #cabb92;
    --card: #faf2e0;
    --card-edge: #efe3c8;
    --ink: #3e2b1f;
    --ink-soft: #6b584a;
    --accent: #bd5f34;
    --accent-ink: #fff6ec;
    --tape-a: #7fa189;
    --tape-b: #dd97a2;
    --shadow: rgba(62, 43, 31, 0.28);
    --ring: #e2d3ab;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(0,0,0,0.06), transparent 45%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0 2px, transparent 2px 4px),
      linear-gradient(180deg, var(--bg), var(--bg-2));
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-size: 17px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .board {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  h1, h2 {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic Medium", "Zen Maru Gothic", "Hiragino Sans", sans-serif;
    text-wrap: balance;
    margin: 0;
  }

  a { color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* ---- nameplate ---- */
  .nameplate {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    padding: 34px 28px 30px;
    box-shadow: 0 14px 30px var(--shadow);
    transform: rotate(-1.4deg);
    text-align: center;
  }
  .nameplate h1 {
    font-size: clamp(2rem, 7vw, 2.8rem);
    letter-spacing: 0.02em;
  }
  .nameplate p {
    margin: 10px 0 0;
    color: var(--ink-soft);
    font-size: 1rem;
  }
  .pin {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8a6a, #b5462a 70%);
    box-shadow: 0 3px 6px var(--shadow);
  }
  .avatar-wrap {
    position: absolute;
    right: -14px;
    top: -30px;
    width: 86px;
    height: 86px;
    border-radius: 50%;
    padding: 5px;
    background: var(--card);
    box-shadow: 0 8px 18px var(--shadow);
    transform: rotate(6deg);
  }
  .avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  /* ---- section headings ---- */
  section { margin-top: 56px; }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 18px;
    padding-left: 2px;
  }
  .section-head .stroke {
    width: 34px;
    height: 3px;
    background: var(--accent);
    border-radius: 3px;
    flex: none;
  }
  .section-head h2 {
    font-size: 1.35rem;
  }

  /* ---- tape ---- */
  .tape {
    position: absolute;
    height: 26px;
    width: 90px;
    top: -13px;
    left: 50%;
    transform: translateX(-50%) rotate(-3deg);
    opacity: 0.85;
    box-shadow: 0 2px 4px var(--shadow);
  }
  .tape.a { background: repeating-linear-gradient(-45deg, var(--tape-a), var(--tape-a) 8px, color-mix(in srgb, var(--tape-a) 75%, white) 8px, color-mix(in srgb, var(--tape-a) 75%, white) 16px); }
  .tape.b { background: repeating-linear-gradient(-45deg, var(--tape-b), var(--tape-b) 8px, color-mix(in srgb, var(--tape-b) 75%, white) 8px, color-mix(in srgb, var(--tape-b) 75%, white) 16px); }

  /* ---- cassette card ---- */
  .cassette {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 22px 22px 20px;
    box-shadow: 0 12px 24px var(--shadow);
    transform: rotate(0.8deg);
  }
  .cassette-body {
    background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 88%, transparent), var(--ink));
    border-radius: 8px;
    padding: 18px 18px 22px;
    color: var(--accent-ink);
  }
  .reels { display: flex; justify-content: space-between; align-items: center; padding: 0 18px; }
  .reel {
    width: 46px; height: 46px; border-radius: 50%;
    background: repeating-conic-gradient(var(--accent-ink) 0deg 10deg, transparent 10deg 20deg);
    border: 3px solid var(--accent-ink);
    position: relative;
  }
  .reel::after {
    content: "";
    position: absolute; inset: 16px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid var(--accent-ink);
  }
  .cassette-label {
    margin-top: 14px;
    background: var(--accent-ink);
    color: var(--ink);
    border-radius: 5px;
    padding: 10px 14px;
    text-align: center;
  }
  .cassette-label .song {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic Medium", sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .cassette-label .by { font-size: 0.85rem; color: var(--ink-soft); margin-top: 2px; }
  .cassette-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    font-weight: 700;
    padding: 11px 18px;
    border-radius: 999px;
    box-shadow: 0 6px 14px var(--shadow);
    transition: transform 0.15s ease;
  }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--ink-soft);
    box-shadow: none;
  }
  @media (hover: hover) {
    .btn:hover { transform: translateY(-2px); }
  }
  .btn svg { flex: none; }

  /* ---- game card ---- */
  .cartridge {
    position: relative;
    display: flex;
    gap: 18px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 12px 24px var(--shadow);
    transform: rotate(-0.9deg);
    text-decoration: none;
    color: var(--ink);
  }
  .cartridge + .cartridge {
    margin-top: 16px;
    transform: rotate(0.7deg);
  }
  .cartridge-badge {
    flex: none;
    width: 64px;
    height: 64px;
    border-radius: 10px;
    background: linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 60%, black));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
  }
  .cartridge-text .game-name {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic Medium", sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .cartridge-text p {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }
  .cartridge-arrow {
    margin-left: auto;
    flex: none;
    color: var(--accent);
  }

  /* ---- goods / hangtag ---- */
  .hangtag-wrap {
    display: flex;
    justify-content: center;
    padding-top: 10px;
  }
  .hangtag {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 14px 14px 10px 10px;
    padding: 18px 18px 20px;
    box-shadow: 0 14px 28px var(--shadow);
    transform: rotate(2.2deg);
    width: min(280px, 78vw);
    text-align: center;
  }
  .hangtag::before {
    content: "";
    position: absolute;
    top: -34px;
    left: 50%;
    width: 2px;
    height: 36px;
    background: var(--ink-soft);
    transform: translateX(-50%) rotate(-2deg);
  }
  .hangtag-hole {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--bg);
    border: 3px solid var(--card-edge);
  }
  .hangtag img {
    width: 100%;
    display: block;
    border-radius: 8px;
  }
  .hangtag .caption {
    margin-top: 12px;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic Medium", sans-serif;
    font-weight: 700;
  }
  .hangtag .note {
    margin: 4px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  /* ---- photo gallery ---- */
  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 28px 18px;
    padding-top: 12px;
  }
  .polaroid {
    position: relative;
    background: var(--card);
    padding: 10px 10px 26px;
    border-radius: 3px;
    box-shadow: 0 10px 20px var(--shadow);
    transition: transform 0.2s ease;
  }
  .polaroid img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 2px;
    display: block;
    background: var(--ring);
  }
  .polaroid:nth-child(6n+1) { transform: rotate(-3deg); }
  .polaroid:nth-child(6n+2) { transform: rotate(2deg); }
  .polaroid:nth-child(6n+3) { transform: rotate(-1.5deg); }
  .polaroid:nth-child(6n+4) { transform: rotate(2.6deg); }
  .polaroid:nth-child(6n+5) { transform: rotate(-2.2deg); }
  .polaroid:nth-child(6n+6) { transform: rotate(1.4deg); }
  @media (hover: hover) {
    .polaroid:hover { transform: rotate(0deg) scale(1.04); z-index: 2; }
  }

  footer {
    margin-top: 64px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }
  footer .paw {
    display: block;
    margin: 0 auto 10px;
    opacity: 0.7;
  }

  @media (min-width: 640px) {
    .gallery { grid-template-columns: repeat(3, 1fr); }
    body { font-size: 18px; }
  }

  @media (max-width: 600px) {
    body { font-size: 18px; line-height: 1.85; }
    .board { padding: 36px 14px 64px; }
    .nameplate { padding: 30px 20px 26px; }
    .avatar-wrap { right: -8px; top: -26px; width: 74px; height: 74px; }
    section { margin-top: 46px; }
    .gallery { gap: 22px 14px; }
    .cartridge { flex-wrap: wrap; }
    .cartridge-arrow { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div class="board">

    <div class="pin"></div>

    <div class="section-head">
      <span class="stroke"></span>
      <h2 id="game-h">あそんでみる</h2>
    </div>

      <div class="tape b"></div>

        <div class="game-name">ねいろの もぐらたたき</div>

      <div class="tape a"></div>
      <div class="cartridge-badge">

          <circle cx="12" cy="12" r="8"/>
          <path d="M12 4v3M12 17v3M4 12h3M17 12h3"/>

      </div>
      <div class="cartridge-arrow" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>

  <section aria-labelledby="goods-h">

    <div class="hangtag-wrap">
      <div class="hangtag">
        <div class="hangtag-hole"></div>
        <img src="@@STICKER@@" alt="ねいろのステッカー" />

  <section aria-labelledby="photos-h">
    <div class="section-head">
      <span class="stroke"></span>
      <h2 id="photos-h">ねいろの日常</h2>

  <footer>

</div>
